[package]
name = "tracked-anyhow"
# Independent fork SemVer; +anyhow.X.Y.Z records the upstream base.
# Bump the fork version for every release, including upstream updates.
# Cargo ignores build metadata when resolving versions, so never release
# a change to the +anyhow suffix without also bumping the fork version.
version = "0.1.0+anyhow.1.0.104"
authors = ["David Tolnay <dtolnay@gmail.com>"]
categories = ["rust-patterns", "no-std"]
description = "Anyhow with automatic file and line tracking in error diagnostics"
documentation = "https://docs.rs/tracked-anyhow"
edition = "2021"
keywords = ["error", "error-handling"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/imbolc/tracked-anyhow"
rust-version = "1.77"
readme = "README.md"

[lib]
# Preserve upstream imports and doctests under the distinct Cargo package name.
name = "anyhow"

[features]
default = ["std"]
std = []
# THIS HAS NO EFFECT. This feature remains to preserve compatibility with the
# old `backtrace` optional dependency that this crate used to have.
backtrace = []

[dev-dependencies]
futures = { version = "0.3", default-features = false }
rustversion = "1.0.6"
syn = { version = "3", features = ["full"] }
thiserror = "2"
trybuild = { version = "1.0.108", features = ["diff"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = [
    "--generate-link-to-definition",
    "--generate-macro-expansion",
    "--extern-html-root-url=core=https://doc.rust-lang.org",
    "--extern-html-root-url=alloc=https://doc.rust-lang.org",
    "--extern-html-root-url=std=https://doc.rust-lang.org",
]
